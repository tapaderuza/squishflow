# Builds the iOS app on a hosted Mac and captures it running in the simulator.
#
# This exists because the project is developed on Windows and the only Mac to
# hand runs Monterey, which cannot target a current iPhone. GitHub's macOS
# runners carry a recent Xcode, so the shared Kotlin is compiled for Apple
# here, the app is built for the simulator, booted, and photographed. The
# artifacts are the proof that the Kotlin Multiplatform story is real.
#
# Stages are deliberately separate so a failure names its layer: Kotlin for
# iOS, the Xcode project, or the app at runtime.

name: iOS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      # Compose Multiplatform 1.11 references iOS 26 APIs such as
      # UIViewLayoutRegion, so the default Xcode 16 SDK cannot link the app.
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle and Kotlin/Native
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: ios-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle.properties', 'gradle/wrapper/*.properties') }}
          restore-keys: ios-${{ runner.os }}-

      - name: Compile the shared Kotlin for the iOS simulator
        run: ./gradlew :shared:compileKotlinIosSimulatorArm64 --no-daemon --console=plain

      # The shared tests are not run here on purpose. A standalone Kotlin/Native
      # test binary cannot link RevenueCat's Swift UI framework — only Xcode sets
      # up the Swift runtime for that — and the suite is platform-independent
      # logic that already runs on every push through the Android job.

      - name: Build the app for the simulator
        run: |
          # SYMROOT rather than -derivedDataPath: the latter insists on a scheme,
          # and the project keeps none on disk (Xcode generates them on open).
          xcodebuild \
            -project iosApp/iosApp.xcodeproj \
            -target iosApp \
            -sdk iphonesimulator \
            -configuration Debug \
            SYMROOT="$PWD/build/ios" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Boot a simulator and capture the app
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available --json | python3 tools/pick_simulator.py)
          echo "Using simulator $DEVICE"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b

          APP=$(find build/ios -name "*.app" -path "*iphonesimulator*" | head -1)
          echo "Installing $APP"
          xcrun simctl install "$DEVICE" "$APP"

          mkdir -p captures
          # Straight onto the companion: CI has no finger to press "timer only".
          xcrun simctl launch "$DEVICE" com.alvaropassalacqua.squishflow -squishy
          sleep 8
          xcrun simctl io "$DEVICE" screenshot captures/ios-welcome.png

          # A few seconds of the idle body, long enough to catch a blink.
          xcrun simctl io "$DEVICE" recordVideo --codec h264 captures/ios-idle.mp4 &
          REC=$!
          sleep 12
          kill -INT $REC || true
          sleep 3

          # The Swift entry screen, for completeness.
          xcrun simctl terminate "$DEVICE" com.alvaropassalacqua.squishflow || true
          xcrun simctl launch "$DEVICE" com.alvaropassalacqua.squishflow
          sleep 5
          xcrun simctl io "$DEVICE" screenshot captures/ios-entry.png
          ls -la captures

      - name: Upload captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-captures
          path: captures/
          if-no-files-found: ignore

      - name: Upload the simulator build
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-app
          path: build/ios/Debug-iphonesimulator/*.app

  # An unsigned build for a physical iPhone, packaged as an IPA. There is no Mac
  # here capable of installing it, so it is signed on the way in instead: a
  # sideloading tool on Windows re-signs it with an ordinary Apple ID and installs
  # it over USB. Unsigned on purpose — the tool applies its own signature and
  # entitlements, and a free Apple ID cannot carry Family Controls anyway.
  device:
    needs: ios
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle and Kotlin/Native
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.konan
          key: ios-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle.properties', 'gradle/wrapper/*.properties') }}
          restore-keys: ios-${{ runner.os }}-

      - name: Build for a physical iPhone
        run: |
          xcodebuild             -project iosApp/iosApp.xcodeproj             -target iosApp             -sdk iphoneos             -configuration Debug             SYMROOT="$PWD/build/ios-device"             ARCHS=arm64             ONLY_ACTIVE_ARCH=YES             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO             build

      - name: Package as an IPA
        run: |
          set -euo pipefail
          APP=$(find build/ios-device -name "*.app" -path "*iphoneos*" | head -1)
          echo "packaging $APP"
          mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          (cd ipa && zip -qr ../Squishflow-unsigned.ipa Payload)
          ls -la Squishflow-unsigned.ipa

      - name: Upload the IPA
        uses: actions/upload-artifact@v4
        with:
          name: Squishflow-iphone-ipa
          path: Squishflow-unsigned.ipa

  # Walks every main screen on the simulator by tapping through the
  # accessibility tree, so the parity with Android is shown rather than claimed.
  # Kept as its own job: it depends on a third-party driver (idb) and should not
  # be able to turn the proven build red.
  walkthrough:
    needs: ios
    runs-on: macos-15
    timeout-minutes: 30
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Download the simulator build
        uses: actions/download-artifact@v4
        with:
          name: ios-simulator-app
          path: app

      - name: Install idb
        run: |
          # Homebrew 6 loads nothing from a third-party tap until it is trusted.
          brew tap facebook/fb
          brew trust facebook/fb
          brew install idb-companion
          pip3 install --break-system-packages fb-idb

      - name: Walk the app and photograph each screen
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available --json | python3 tools/pick_simulator.py)
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          APP=$(find app -name "*.app" -maxdepth 2 | head -1)
          xcrun simctl install "$DEVICE" "$APP"
          mkdir -p walkthrough
          idb_companion --udid "$DEVICE" --only simulator > walkthrough/companion.log 2>&1 &
          sleep 6
          idb connect "$DEVICE"
          idb list-targets
          python3 tools/ios_walkthrough.py "$DEVICE" com.alvaropassalacqua.squishflow walkthrough

      - name: Upload the walkthrough
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-walkthrough
          path: walkthrough/
          if-no-files-found: ignore
